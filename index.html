<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SD Court App</title>
<!-- The app lives at board.html; this root file exists only so the plain
     Pages URL (…/DisplayBoard/) doesn't 404 — GitHub Pages needs an
     index.html at the root. board.html itself is untouched; the PWA
     manifest's start_url already points at ./board.html directly, so
     this redirect has no effect on installed-app behaviour. -->
<meta http-equiv="refresh" content="0; url=board.html">
<link rel="canonical" href="board.html">
<script>location.replace("board.html");</script>
</head>
<body>
<p>Loading the display board… if it doesn't open automatically, <a href="board.html">tap here</a>.</p>
</body>
</html>
