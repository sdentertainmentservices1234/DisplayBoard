    await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
    ]);
  const app=initializeApp(firebaseConfig); const fa=getAuth(app); const fs=getFirestore(app);
  db={ watchCollection(path,cb,order){const c=collection(fs,...path.split("/"));const q=order?query(c,orderBy(order[0],order[1])):c;
      return onSnapshot(q,s=>{const r=[];s.forEach(d=>r.push({id:d.id,...d.data()}));cb(r);});},
    watchDoc(path,cb){return onSnapshot(doc(fs,...path.split("/")),s=>cb(s.exists()?{id:s.id,...s.data()}:null));},
    async set(path,data,merge){await setDoc(doc(fs,...path.split("/")),data,{merge:!!merge});},
    async add(path,data){const r=await addDoc(collection(fs,...path.split("/")),data);return r.id;},
    async update(path,data){await updateDoc(doc(fs,...path.split("/")),data);},
    async remove(path){await deleteDoc(doc(fs,...path.split("/")));}, now:serverTimestamp };
  auth={ onChange(cb){ onAuthStateChanged(fa,async user=>{
      if(user){ const uref=doc(fs,"users",user.uid); const snap=await getDoc(uref);
        if(!snap.exists()){
          let base;
          if(pendingReg){   // a self-registrant creating their own standalone "office"
            base={name:pendingReg.name, email:user.email, phone:pendingReg.phone||"", designation:pendingReg.designation||"",
              role:"user", office:pendingReg.name, active:true, createdAt:serverTimestamp()};
            pendingReg=null;
          } else {
            base={name:user.email.split("@")[0],email:user.email,role:"pending",active:true,createdAt:serverTimestamp()};
            if(emailKey(user.email)===emailKey(CHAMBER.adminEmail)) base.role="admin";
            try{ const ap=await getDoc(doc(fs,"approvals",emailKey(user.email)));
              if(ap.exists()){ const a=ap.data(); base={...base,name:a.name||base.name,role:a.role||base.role,phone:a.phone||"",joinedOn:a.joinedOn||null}; }
            }catch(e){}
          }
          try{ await setDoc(uref,base); }catch(e){ try{ await setDoc(uref,{name:user.email.split("@")[0],email:user.email,role:"pending",active:true,createdAt:serverTimestamp()}); }catch(_){} }
        }
      } cb(user); }); },
    signIn(email,pass){return signInWithEmailAndPassword(fa,email,pass);},
    signUp(email,pass,reg){ pendingReg=reg; return createUserWithEmailAndPassword(fa,email,pass); },
    resetPassword(email){return sendPasswordResetEmail(fa,email);},
    signOut(){return signOut(fa);}, setUser(){} };
}

/* ============================================================
   STATE
   ============================================================ */
let me=null, users={}, daysheet=null, live={}, messages={};
let board=[], boardAt=0, boardErr=null, paceHist={}, _primaryCourt=null, courtUpdates=null;
let curTab="board", userDocUnsub=null, unsub=[], pollId=null, tickId=null, pollOn=false;
let lastSeenChat=(()=>{ try{ return parseInt(localStorage.getItem("boardChatSeen")||"0",10)||0; }catch(e){ return 0; } })();

const boardByCourt = () => { const m={}; board.forEach(c=>{ if(c.court && !m[c.court]) m[c.court]=c; }); return m; };
// Matters to track = the chamber day sheet PLUS this user's own matters (added by
// court+item in "Track a matter"), private to them. Dedup a personal matter that
// duplicates a day-sheet entry (same court+item) — the day-sheet one wins (richer).
let myOwn=[];
let briefLinks=[], briefMsgs=[]; // BRIEFING FEATURE — AoR↔chamber links + their message threads
let boardView="mine";            // a briefing AoR can toggle: "mine" (own board) | "senior"
let briefOpenThread=null;        // team inbox: the thread currently open
let briefSeen=(()=>{ try{ return JSON.parse(localStorage.getItem("briefSeen")||"{}")||{}; }catch(e){ return {}; } })();
const myMatters = () => {
  const ds=(daysheet?.entries||[]).filter(e=>e.courtNo);
  const key=e=>String(e.courtNo)+"|"+String(e.itemNo);
  const seen=new Set(ds.map(key));
  const own=(myOwn||[]).filter(m=>m.court&&m.item).map(m=>({courtNo:String(m.court), itemNo:String(m.item),
    caseTitle:m.title||"", juniorUids:me?[me.uid]:[], _own:m.id}));
  return [...ds, ...own.filter(o=>!seen.has(key(o)))];
};
// The SC has 17 courtrooms; anything above is the Registrar / administrative list.
// The display board tracks the courtrooms only (owner: no registrar under the
// court headings) — registrar matters still appear in "Our list".
const isCourtroom = n => { const x=parseInt(n,10); return x>=1 && x<=17; };
// BRIEFING: a briefing AoR sees TWO boards — their own cases, or (when approved)
// the senior's whole board. The toggle swaps the tracked matter set at the source,
// so board + rail + flash + alerts all follow it. Chamber members are unaffected.
const myApprovedLinks = () => briefLinks.filter(l=>l.aorUid===me?.uid && l.status==="approved");
// A brief approval is good ONLY for the date(s) the request was for — after that day it
// lapses (re-request for the next date). linkState → active | scheduled | expired.
const linkDates = l => { const ds=[...new Set((((l&&l.matters)||[]).map(m=>m&&m.date).filter(Boolean)))]; return ds.length?ds:(l&&l.date?[l.date]:[]); };
function linkState(l){ if(!l||l.status!=="approved") return (l&&l.status)||"none";
  const ds=linkDates(l); if(!ds.length) return "active";
  const t=todayISO(); if(ds.includes(t)) return "active"; if(ds.some(d=>d>t)) return "scheduled"; return "expired"; }
const linkActive = l => linkState(l)==="active";
const linkSoonDate = l => { const t=todayISO(), ds=linkDates(l); return ds.filter(d=>d>=t).sort()[0] || ds.sort().slice(-1)[0] || null; };
const fmtDay = d => { try{ return new Date(d+"T00:00:00").toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }catch(e){ return d; } };
// The tracking window (ms, IST calendar days) an approval is valid for — stamped on the
// brieflink and mirrored to briefaccess/{aorUid} so the Firestore rules gate the day-sheet
// read server-side, not just the UI.
function linkWindow(dates){ const ds=[...new Set((dates||[]).filter(Boolean))].sort(); if(!ds.length) return {};
  return { startsAt:new Date(ds[0]+"T00:00:00+05:30").getTime(), expiresAt:new Date(ds[ds.length-1]+"T00:00:00+05:30").getTime()+864e5 }; }
const isBriefAoR      = () => BRIEFING && !!me && myApprovedLinks().some(linkActive);
// The case(s) an AoR is briefing the senior in — carried on the brieflink (matters[]),
// with a fallback to the legacy single court/item. Used to FLAG those courts on the
// senior's board so the AoR finds their matter instead of getting lost in his many.
const linkMatters = l => (l && l.matters && l.matters.length)
  ? l.matters.filter(m=>m&&m.court&&m.item).map(m=>({court:String(m.court),item:String(m.item),date:m.date||"",title:m.title||"",listType:m.listType||"",party:m.party||"",bench:m.bench||"",aor:m.aor||""}))
  : (l && l.court && l.item ? [{court:String(l.court),item:String(l.item),date:l.date||"",title:l.title||"",listType:l.listType||"",party:"",bench:"",aor:""}] : []);
// Only ACTIVE links, and only TODAY's cases, feed the senior-board highlight.
const myBriefMatters   = () => myApprovedLinks().filter(linkActive).flatMap(l=>linkMatters(l).filter(m=>!m.date||m.date===todayISO()));
const isBriefCaseCourt = court => BRIEFING && isBriefAoR() && boardView==="senior" && myBriefMatters().some(m=>String(m.court)===String(court));
const briefCaseItemsIn = court => myBriefMatters().filter(m=>String(m.court)===String(court)).map(m=>m.item);
const ownMattersList  = () => (myOwn||[]).filter(m=>m.court&&m.item).map(m=>({courtNo:String(m.court),itemNo:String(m.item),caseTitle:m.title||"",juniorUids:me?[me.uid]:[],_own:m.id}));
const seniorMattersList = () => (daysheet?.entries||[]).filter(e=>e.courtNo).map(e=>({courtNo:String(e.courtNo),itemNo:String(e.itemNo),caseTitle:e.caseTitle||"",listType:e.listType||"",juniorUids:e.juniorUids||[],bench:e.bench,counsel:e.counsel,time:e.time}));
function boardSourceMatters(){
  if(BRIEFING && isBriefAoR()) return (boardView==="senior") ? seniorMattersList() : ownMattersList();
  if(me && me.role==="user") return ownMattersList();   // standalone individual — their own matters only
  return myMatters();                                    // chamber member — day sheet + own
}
const courtMatters = () => boardSourceMatters().filter(e=>isCourtroom(e.courtNo));
const shortTitle = e => e.caseTitle || ("Court "+e.courtNo+" item "+e.itemNo);
const isSenior = () => me?.role==="senior";           // the Senior doesn't set/see his own location

/* ============================================================
   BOARD FETCH
   ============================================================ */
async function fetchBoard(){
  try{
    let html="";
    if(BOARD_SAMPLE){ html=await (await fetch(BOARD_SAMPLE,{cache:"no-store"})).text(); }
    else if(BOARD_PROXY){ html=await (await fetch(BOARD_PROXY+"?ctype=c",{cache:"no-store"})).text(); }
    else { boardErr="relay-unset"; renderBoard(); return; }
    const parsed=parseBoard(html);
    if(parsed.courts.length){ board=parsed.courts; boardAt=Date.now(); boardErr=null; recordPace(); recordBoardPO(); noteItemHi(); refreshRemarks(); }
    else boardErr="empty";
  }catch(e){ boardErr=String(e&&e.message||e); }
  fetchSeqLine();                 // published court-wise sequence (throttled inside)
  runAlerts();
  runFlash();
  renderBoard();
}
// Pull the old board's published SEQUENCE marquee (worker ?seq) and parse it into
// per-court order. Throttled to ~60s — it changes far more slowly than the board.
// Non-fatal: any failure just leaves the last-known sequence (or none) in place, so
// the app falls back to pure live ordering exactly as before.
async function fetchSeqLine(){
  if(!SEQ_LINE || !BOARD_PROXY || BOARD_SAMPLE) return;
  if(Date.now()-seqLineAt < 60000) return;
  seqLineAt=Date.now();
  try{
    const j=await (await fetch(BOARD_PROXY+"?seq",{cache:"no-store"})).json();
    const txt=(j&&typeof j.seq==="string")?j.seq:"";
    if(txt!==seqLineText){ seqLineText=txt; seqByCourt=parseSequenceLine(txt); }
  }catch(e){ /* keep whatever we had */ }
}
// Adaptive polling — we track the SC board as tightly as it moves. When one of
// our matters is at/near its turn we poll every 6s; otherwise every 12s to stay
// light. A self-scheduling timeout (not setInterval) lets the cadence change each
// cycle and never lets two fetches overlap.
function pollDelay(){
  const bc=boardByCourt();
  const hot=courtMatters().some(e=>{ const t=classify(e,bc[e.courtNo]).tier; return t==="now"||t==="soon"; });
  return hot?6000:12000;
}
async function pollLoop(){ if(!pollOn) return; await fetchBoard(); if(!pollOn) return; pollId=setTimeout(pollLoop, pollDelay()); }
function startPolling(){ stopPolling(); pollOn=true; tickId=setInterval(paintFresh,1000); pollLoop(); }  // 1s tick only ages the freshness label
function stopPolling(){ pollOn=false; if(pollId)clearTimeout(pollId); if(tickId)clearInterval(tickId); pollId=tickId=null; }

// Refresh: freshest app version AND freshest board. Clears caches + cache-bust
// reload (so an installed PWA can't sit on a stale shell); reload re-pulls board.
async function hardRefresh(){
  const b=$("btnRefresh"); if(b) b.classList.add("spin");
  try{ if("caches" in window){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
  try{ if(navigator.serviceWorker){ const rs=await navigator.serviceWorker.getRegistrations(); rs.forEach(r=>r.update&&r.update()); } }catch(e){}
  const u=new URL(location.href); u.searchParams.set("v", String(Date.now()));
  location.replace(u.toString());
}

/* ============================================================

function paintFresh(){
  const dot=$("freshDot"), txt=$("statusTxt");
  if(!dot||!txt) return;
  const day=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
  if(boardErr==="relay-unset"){ dot.className="freshdot off"; txt.textContent=day+" · relay not set"; return; }
  if(boardErr){ dot.className="freshdot stale"; txt.textContent=day+" · board offline"; return; }
  if(!boardAt){ dot.className="freshdot off"; txt.textContent=day+" · connecting…"; return; }
  dot.className="freshdot"+((Date.now()-boardAt)>45000?" stale":"");
  txt.textContent=day+" · updated "+agoTxt(boardAt);
}

// senior location: confirmed (config/live.court, fresh <25m) else inferred
function seniorState(){
  const c=live?.court; const at=c?tsMs(c.at):0;
  const fresh=at && (Date.now()-at)<25*60*1000;
  if(c && c.court && fresh) return {court:c.court, mode:"confirmed", at, by:c.by};
  const bc=boardByCourt(); let best=null;
  for(const e of courtMatters()){
    const k=classify(e,bc[e.courtNo]);
    if(k.tier==="now"||k.tier==="soon"){ if(!best || (k.gap??99)<(best.gap??99)) best={court:e.courtNo,gap:k.gap}; }
  }
  if(best) return {court:best.court, mode:"inferred"};
  if(c && c.court) return {court:c.court, mode:"stale", at};
  return {court:null, mode:"none"};
}

// Route rail: our stops in the order to reach them (soonest first), one small chip per
// court, colour-coded by distance band (red ≤2 · amber 3–4 · green 5–7 · neutral
// beyond). Wraps into rows so all fit on one screen. On-now reads "our N on".
function renderRail(){
  const rail=$("routeRail"); if(!rail) return;
  if(!board.length){ _primaryCourt=null;
    rail.innerHTML=`<div class="rail-empty">${boardErr&&boardErr!=="relay-unset"?"Board offline":"Reading the board…"}</div>`; return; }
  const bc=boardByCourt();
  const cands=courtMatters().map(e=>({e,k:classify(e,bc[e.courtNo])}))
    .filter(x=>["now","soon","later"].includes(x.k.tier) && !x.k.done && !x.k.over)
    .map(x=>({court:x.e.courtNo, e:x.e, k:x.k, mins:reachMinsFor(x.e.courtNo,x.k)}))
    .sort((a,b)=>((a.mins==null?9999:a.mins)-(b.mins==null?9999:b.mins)) || ((a.k.gap??999)-(b.k.gap??999)));
  const seen=new Set(), stops=[];
  for(const c of cands){ const key=String(c.court); if(seen.has(key)) continue; seen.add(key); stops.push(c); }
  if(!stops.length){ _primaryCourt=null;
    rail.innerHTML=`<div class="rail-empty">All quiet — no chamber matter is close right now.</div>`; return; }
  _primaryCourt=stops[0].court;
  const band=g=> g==null?"far" : g<=2?"red" : g<=4?"amber" : g<=7?"green" : "far";
  const distLab=k=> k.ment ? "WATCH" : (k.gap===0||k.short==="NOW") ? "NOW" : k.gap===1 ? "NEXT"
                 : (k.gap!=null ? k.gap+" away" : (k.short||"—"));
  const chip=s=>{
    const isNow=(s.k.gap===0||s.k.short==="NOW")&&!s.k.ment;
    // when OUR matter is the one on, just say "our N is on" — not which item is on / ours
    return isNow
      ? `<button class="rail-stop red" data-court="${esc(s.court)}"><span class="rail-ct">our <b>${esc(s.e.itemNo)}</b> is on</span></button>`
      : `<button class="rail-stop ${band(s.k.ment?null:s.k.gap)}" data-court="${esc(s.court)}"><span class="rail-ct">Ct <b>${esc(s.court)}</b></span><span class="rail-dist">${esc(distLab(s.k))}</span></button>`;
  };
  // arrows between chips show the flow (which court to reach first → next → …)
  rail.innerHTML=stops.map((s,i)=>`${i?'<span class="rail-arrow"><i class="ti ti-chevron-right"></i></span>':''}${chip(s)}`).join("");
}

// one court tile: full island when we have matters there, mini otherwise
function boardCell(c, senCourt, senMode){
  const idle=/not in session/i.test(c.status||"");
  const ours=courtMatters().filter(e=>String(e.courtNo)===String(c.court));
  const mine=isBriefCaseCourt(c.court);                    // an AoR's briefed case sits in this court
  const myItems=new Set(mine?briefCaseItemsIn(c.court).map(String):[]);
  const sen = senCourt && String(senCourt)===String(c.court);
  const live = sen && senMode==="confirmed";
  const senCls = sen ? " sen"+(live?" senlive":"") : "";
  const pin = sen ? `<span class="senpin${live?"":" inferred"}"><i class="ti ti-user-check"></i><span class="lab">${live?"Senior here":"Likely here"}</span></span>` : "";
  const rib = mine ? `<div class="mycase-rib"><i class="ti ti-star-filled"></i> Your case</div>` : "";
  // top row: court no. prominent on the LEFT, the item now on the RIGHT
  const head=`<div class="cell-head">
    <div class="ct-side"><span class="ct-num">C<span class="cd">${esc(c.court)}</span></span></div>
    <div class="cell-div"></div>
    <div class="on-side">${idle?`<span class="on-lab">not sitting</span><span class="on-num">—</span>`
      :`<span class="on-lab">on</span><span class="on-num">${esc(c.item||"·")}</span>`}</div>
  </div>`;
  if(!ours.length && !mine){
    return `<div class="cell mini ${idle?"idle":""}${senCls}" data-court="${esc(c.court)}">${pin}${head}</div>`;
  }
  // build the item set: the senior's matters here, plus (if this is my case court) any
  // of my briefed items the senior isn't separately listed on — so my item always shows
  let src=ours.slice();
  if(mine){ const have=new Set(src.map(e=>String(e.itemNo))); briefCaseItemsIn(c.court).forEach(it=>{ if(!have.has(String(it))) src.push({courtNo:String(c.court),itemNo:String(it),caseTitle:""}); }); }
  const ks=src.map(e=>({e,k:classify(e,c)})).sort((a,b)=>(TIER_RANK[a.k.tier]-TIER_RANK[b.k.tier])||((a.k.gap??999)-(b.k.gap??999)));
  const tier=ks[0].k.tier;
  // a matter marked over (attended / not attended) is struck through here; my own briefed item is bolded
  const items=ks.map(x=>{ let t=x.k.done?`<s>${esc(x.e.itemNo)}</s>`:esc(x.e.itemNo); return myItems.has(String(x.e.itemNo))?`<b class="myit">${t}</b>`:t; }).join(" · ");
  return `<div class="cell ours ${tier} ${idle?"idle":""}${senCls}${mine?" mycase":""}" data-court="${esc(c.court)}">
    ${rib}${pin}${head}
    <div class="cell-ours"><span class="oi">${items}</span><br>${esc(ks[0].k.short||ks[0].k.label)}</div></div>`;
}
function renderBoardSwitch(){
  const el=$("boardSwitch"); if(!el) return;
  if(!(BRIEFING && isBriefAoR())){ el.classList.add("hidden"); return; }
  const srName=(CHAMBER.seniorName||"Senior").split(" ")[0];
  el.classList.remove("hidden");
  el.innerHTML=`<button data-bv="mine" class="${boardView==="mine"?"on":""}">My board</button>
    <button data-bv="senior" class="${boardView==="senior"?"on":""}">${esc(srName)}'s board</button>`;
  el.querySelectorAll("[data-bv]").forEach(b=>b.onclick=()=>{ boardView=b.dataset.bv; renderBoard(); });
}
function renderBoard(){
  renderBoardSwitch();
  paintFresh(); renderRail();
  if(curTab!=="board") return;
  let h="";
  if(boardErr && boardErr!=="relay-unset") h+=`<div class="notice"><b>Can't reach the board</b> — retrying every 15 seconds.</div>`;
  if(!board.length){ $("main").innerHTML=h+`<div class="empty">Loading the display board…</div>`; return; }
  const ourCourts=new Set(courtMatters().map(e=>String(e.courtNo)));
  // (colour-code legend removed — red/amber/green are self-evident now)
  // Only the 17 courtrooms — never the Registrar / administrative list (courts
  // >17), even if we have a matter there (owner: no registrar under the court
  // headings; those still show in "Our list"). Our courts render first at full
  // size; the rest shrink to minis — all fit one screen, no scrolling.
  // the senior-here pin belongs to the chamber; a standalone user only sees it when
  // they're viewing a senior's board they've been approved to track (not their own).
  const showSen = !(isStandalone() && boardView!=="senior");
  const ss=seniorState(), senCourt=showSen?ss.court:null, senMode=ss.mode;
  // When an AoR is viewing the senior's board, spotlight the court(s) holding THEIR
  // briefed matter — floated first, gold-ringed, and listed in a banner — so they
  // don't get lost among the senior's many cases.
  const mineOnSenior = BRIEFING && isBriefAoR() && boardView==="senior" ? myBriefMatters() : [];
  if(mineOnSenior.length){
    const seen=new Set(), lab=[];
    mineOnSenior.forEach(m=>{ const k=String(m.court)+"|"+String(m.item); if(!seen.has(k)){ seen.add(k); lab.push(`Ct ${esc(m.court)} · ${esc(m.item)}`); } });
    h+=`<div class="mycasebar"><i class="ti ti-star-filled"></i> Your case${lab.length>1?"s":""}: <b>${lab.join("</b>, <b>")}</b></div>`;
  }
  const shown=[...board].filter(c=>isCourtroom(c.court));
  const byNo=(a,b)=>(parseInt(a.court)||999)-(parseInt(b.court)||999);
  const isFull=c=>ourCourts.has(String(c.court))||isBriefCaseCourt(c.court);
  // my-case courts sort before the senior's other courts within the full grid
  const fullSort=(a,b)=>((isBriefCaseCourt(b.court)?1:0)-(isBriefCaseCourt(a.court)?1:0))||byNo(a,b);
  const full=shown.filter(isFull).sort(fullSort);
  const mini=shown.filter(c=>!isFull(c)).sort(byNo);
  h+=`<div class="grid">`+full.map(c=>boardCell(c,senCourt,senMode)).join("")+`</div>`;
  if(mini.length) h+=`<div class="grid" style="margin-top:7px">`+mini.map(c=>boardCell(c,senCourt,senMode)).join("")+`</div>`;
  $("main").innerHTML=h;
}

  const bc=boardByCourt();

  let h=`<div class="legend" style="margin-bottom:12px">Chamber cause list · ${todayISO().split("-").reverse().join(".")}</div>`;

      <div class="d"><div class="t">${esc(e.caseTitle||"—")}</div>
      <div class="m">${e.bench?`<b>Bench:</b> ${esc(e.bench)}<br>`:""}${e.counsel?`${esc(e.counsel)}`:""}${jl?` — ${esc(jl)}`:""}${e.confTime?`<br><b>Conf:</b> ${esc(e.confTime)}`:""}</div>
      <select class="li-stat" data-court="${esc(e.courtNo)}" data-item="${esc(e.itemNo)}" aria-label="Mark status">

        ${cur?`<option value="clear">Clear status</option>`:""}

  }

  $("main").querySelectorAll(".li-stat").forEach(sel=>sel.onchange=async()=>{
    const court=sel.dataset.court, item=sel.dataset.item, v=sel.value; sel.disabled=true;

// A fresh window every day: the chat only ever shows TODAY's messages. Anything
// from an earlier day is never displayed, and is purged best-effort (see below).
const msgDay = m => { const ms=tsMs(m.at); return ms?new Date(ms).toLocaleDateString('en-CA'):todayISO(); };
const todayMsgs = () => Object.values(messages).filter(m=>msgDay(m)===todayISO()).sort((a,b)=>tsMs(a.at)-tsMs(b.at));
const clockIST = ms => { try{ return new Date(ms).toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata',hour12:false,hour:'2-digit',minute:'2-digit'}); }catch(e){ return ""; } };
// Delete messages older than today so the collection doesn't grow forever. Rules
// let a member remove their OWN messages and let Staff/PA/admin remove anyone's —
// so a manager opening the board clears the shared history fully, a colleague
// clears their own. Either way the day-filter above already hides the rest. Once
// per session, and never blocks the UI.
let _chatPurged=false;
async function purgeOldChat(){
  if(_chatPurged || !me) return; _chatPurged=true;
  const old=Object.values(messages).filter(m=>msgDay(m)<todayISO());
  for(const m of old){ try{ await db.remove("messages/"+m.id); }catch(e){} }
}
function chatListHtml(){
  const list=todayMsgs();
  if(!list.length) return `<div class="empty">No messages yet today.<br>Coordinate here — everyone in the chamber sees it live.</div>`;
  const dayLabel=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  let html=`<div class="chat-day">Today · ${esc(dayLabel)}</div>`;
  let lastBy=null, lastMs=0;
  for(const m of list){
    const mine=m.by===me?.uid, ms=tsMs(m.at);
    const grp = m.by===lastBy && (ms-lastMs)<4*60000;          // same sender within 4 min → group
    html += `<div class="msg ${mine?"mine ":""}${grp?"grp":""}">`
      + ((!mine&&!grp)?`<div class="who">${esc(m.name||"—")}</div>`:"")
      + `<div class="tx">${esc(m.text)}</div><div class="tm">${clockIST(ms)}</div></div>`;
    lastBy=m.by; lastMs=ms;
  }
  return html;
}
// Repaint only the message list — never the composer — so an incoming message
// can't wipe what a colleague is typing or steal focus. Keeps the view pinned to
// the newest message unless the reader has scrolled up to read history.
function paintChatList(){
  const cl=$("chatList"); if(!cl) return;
  const nearBottom = cl.scrollHeight-cl.scrollTop-cl.clientHeight < 80;
  cl.innerHTML=chatListHtml();
  if(nearBottom) cl.scrollTop=cl.scrollHeight;
  if(curTab==="chat") markChatSeen();          // reading the chat clears/holds the badge
}
// Persisted "seen" watermark so the unread badge survives a refresh — otherwise every
// reload reset it to 0 and re-flagged today's already-read messages as new.
function markChatSeen(){
  const msgs=todayMsgs();
  const newest=msgs.length?tsMs(msgs[msgs.length-1].at):0;
  lastSeenChat=Math.max(lastSeenChat, newest, Date.now());
  try{ localStorage.setItem("boardChatSeen", String(lastSeenChat)); }catch(e){}
  updateChatBadge();
}
// Keyboard-aware sizing: pin #chatWrap to the visual viewport so the composer stays
// just above the on-screen keyboard and only the message list scrolls (the box never
// grows or scrolls itself). Driven by window.visualViewport, which shrinks when the
// keyboard opens. Falls back to the CSS flex layout where visualViewport is absent.
let _vvBound=false;
function bindVV(){ if(_vvBound) return; _vvBound=true;
  const on=()=>fitChat();
  if(window.visualViewport){ window.visualViewport.addEventListener("resize",on); window.visualViewport.addEventListener("scroll",on); }
  window.addEventListener("resize",on);
}
function fitChat(){
  const wrap=$("chatWrap");
  if(curTab!=="chat" || !wrap || !window.visualViewport){ document.body.classList.remove("chat-vv","kb-open"); return; }
  const vv=window.visualViewport;
  // Ignore PINCH-ZOOM (scale ≠ 1): only the keyboard should resize the box. A pinch
  // changes vv.height too, and reacting to it made the chat grow/shrink — messaging
  // apps keep the box fixed, so we simply don't re-fit while zoomed.
  if(vv.scale && Math.abs(vv.scale-1) > 0.01) return;
  const headH=document.querySelector("header.top")?.getBoundingClientRect().height||0;
  const kbOpen=(window.innerHeight - vv.height) > 120;                 // keyboard is up
  const navH=kbOpen?0:(document.querySelector("nav.botnav")?.getBoundingClientRect().height||0);
  const cl=$("chatList"); const wasBottom=cl?(cl.scrollHeight-cl.scrollTop-cl.clientHeight<90):true;
  const rs=document.documentElement.style;
  rs.setProperty("--chat-top",(vv.offsetTop+headH)+"px");
  rs.setProperty("--chat-h",Math.max(140, vv.height-headH-navH)+"px");
  document.body.classList.add("chat-vv");
  document.body.classList.toggle("kb-open",kbOpen);
  if(cl&&wasBottom) cl.scrollTop=cl.scrollHeight;
}
function renderChat(){
  $("main").innerHTML=`<div id="chatWrap"><div id="chatList">${chatListHtml()}</div>
    <div class="chatbar"><input id="chatIn" placeholder="Message the chamber…" autocomplete="off" maxlength="1000">
    <button id="chatSend" aria-label="Send"><i class="ti ti-send"></i></button></div></div>`;
  const cl=$("chatList"); cl.scrollTop=cl.scrollHeight;
  $("chatSend").onclick=sendChat;
  $("chatIn").onkeydown=ev=>{ if(ev.key==="Enter"&&!ev.shiftKey){ ev.preventDefault(); sendChat(); } };
  // when the field gains/loses focus the keyboard toggles — re-fit after it settles
  $("chatIn").addEventListener("focus",()=>{ setTimeout(fitChat,200); setTimeout(fitChat,500); });
  $("chatIn").addEventListener("blur",()=>setTimeout(fitChat,200));
  bindVV(); fitChat();
  $("chatIn").focus();
  markChatSeen(); purgeOldChat();
}
async function sendChat(){
  const inp=$("chatIn"); const t=(inp.value||"").trim(); if(!t) return; inp.value=""; inp.focus();
  const id=await db.add("messages",{by:me.uid,name:me.name||"",text:t.slice(0,1000),at:db.now(),day:todayISO()});

  relayPush({kind:"chat", id:String(id||Date.now()), fromUid:me.uid,
    title:(me.name||"Chamber").split(" ")[0]+" · chat", body:t.slice(0,140)});
}
function updateChatBadge(){
  const unseen=todayMsgs().filter(m=>tsMs(m.at)>lastSeenChat && m.by!==me?.uid).length;
  const b=$("chatBadge");
  if(unseen>0 && curTab!=="chat"){ b.textContent=unseen; b.classList.remove("hidden"); } else b.classList.add("hidden");

function render(){

   DETAIL SHEETS — court island → sequence / passovers / totals /
   our matters; our matter → full details + passover marking

async function loadCourtUpdates(){
  // totals per court come from the chamber's fetched causelist (same repo)
  for(const p of ["court-updates.json","../court-updates.json"]){
    try{ const r=await fetch(p+"?_="+Date.now(),{cache:"no-store"});
      if(r.ok){ courtUpdates=await r.json(); return; } }catch(e){}
  }
}
// SC cause-list enrichment (ported from CourtReach) — used by the collaboration
// request form to fetch a briefed case's title / bench / AoR by date+type+court+item.
const CAUSELIST_TYPES = ["Miscellaneous","Regular","Chamber","Single Judge","Registrar","Curative & Review"];
const _titleCase = s => String(s||"").toLowerCase().replace(/\b([a-z])/g,(_,c)=>c.toUpperCase()).replace(/\bM\/s\b/,"M/s");
function titleFromCauseLine(line){
  if(!line) return "";
  let s=String(line).replace(/\s+/g," ").trim();
  s=s.replace(/^\s*connected\s*(?:with\s*)?/i,"");   // drop a leading "Connected" (sub-item / connected-matter marker)
  s=s.replace(/^\s*(?:diary\s*no\.?|[a-z][a-z().\/]*\s*no\.?)?\s*\d{2,6}\s*[-\/]\s*\d{4}\s+/i,"");
  const parts=s.split(/\s+VERSUS\s+/i);
  const clean=x=>String(x||"").replace(/\s*&?\s*(AND\s+)?(ORS?\.?|ANR\.?|OTHERS?)\.?\s*$/i,"").replace(/[,.\s]+$/,"").trim();
  const pet=clean(parts[0]), resp=clean(parts[1]||"");
  return resp ? _titleCase(pet)+" vs "+_titleCase(resp) : _titleCase(pet);
}
function cleanCoram(coram){
  if(!coram) return "";
  return String(coram).split(/HON'BLE/i).map(x=>x.trim()).filter(Boolean).map(p=>{
    if(/CHIEF\s+JUSTICE/i.test(p)) return "C.J.I.";
    p=p.replace(/\b(THE|MR|MRS|MS|DR|JUSTICE)\b\.?/gi," ").replace(/^[.\s]+/,"").replace(/\s+/g," ").trim();
    return p ? _titleCase(p) : "";
  }).filter(Boolean).join(", ");
}
function lookupItem(date,type,court,item){
  const day=courtUpdates?.by_date?.[date];
  if(!day) return {found:false, reason:"No cause list fetched for "+date+" yet."};
  const rec=day.lists?.[type]?.[String(court)];
  if(!rec) return {found:false, reason:"Court "+court+" isn't in the "+type+" list for "+date+"."};
  // Match the item both ways: exact key, then the parent (62.1 → 62), then — if the
  // list only carries connected sub-items — the first sub-item under it (62 → 62.1).
  const it=String(item), n=String(Math.floor(parseFloat(item)));
  let key = (rec.items&&rec.items[it]!=null) ? it : (rec.items&&rec.items[n]!=null) ? n : null;
  if(key==null && rec.items){ const subs=Object.keys(rec.items).filter(k=>Math.floor(parseFloat(k))===parseInt(n,10)).sort((a,b)=>parseFloat(a)-parseFloat(b)); key=subs[0]||null; }
  const line=(key&&rec.items)?rec.items[key]:"";
  const adv=(key&&rec.advocates&&rec.advocates[key])||{};
  if(!line) return {found:false, reason:"Item "+item+" not in the "+type+" list.", bench:cleanCoram(rec.coram)};
  return {found:true, title:titleFromCauseLine(line), bench:cleanCoram(rec.coram), aorPet:_titleCase(adv.pet||""), aorResp:_titleCase(adv.resp||"")};
}
async function fetchBriefCase(f){
  await loadCourtUpdates(); const r=lookupItem(f.date,f.type,f.court,f.item);
  return { court:String(f.court), item:String(f.item), date:f.date, listType:f.type, party:f.party,
    title:r.title||"", bench:r.bench||"", aor: r.found?(f.party==="Petitioner"?r.aorPet:r.aorResp):"", found:!!r.found, reason:r.reason||"" };
}
function totalsFor(court){
  const lists=courtUpdates?.by_date?.[todayISO()]?.lists||{};
  const out=[];
  for(const [type,courts] of Object.entries(lists)){
    if(/registrar/i.test(type)) continue;                  // owner: no registrar in the board app
    const rec=courts?.[String(court)];
    if(rec?.total) out.push(type+": "+rec.total);
  }
  return out;
}

/* ============================================================
   BRIEFING FEATURE (regressible — const BRIEFING)
   An AoR briefing this senior asks the chamber for permission to TRACK the
   senior's board position for their matter, and can ping the team with one tap
   ("my matter is reaching", "bench is calling you"). Demo-tested end-to-end.
   Cross-chamber security hardening (rules so an outside AoR sees ONLY the
   senior's location + their own matter, never the chamber) is the pre-live step.
   Data: brieflinks/{id} {aorUid,aorName,aorDesig,court,item,date,title,note,status,at}
   ============================================================ */
const canApproveBrief = () => ["admin","clerk","pa","senior"].includes(me?.role);
const myBriefLinks    = () => briefLinks.filter(l=>l.aorUid===me?.uid);
const pendingBriefs   = () => briefLinks.filter(l=>l.status==="pending");
const approvedBriefs  = () => briefLinks.filter(l=>l.status==="approved");
const QUICK = { reaching:"My matter is reaching — please come.", five:"My matter is about five away.", three:"My matter is about three away.", next:"My matter is next — please come." };
const threadMsgs   = id => briefMsgs.filter(m=>m.linkId===id).sort((a,b)=>tsMs(a.at)-tsMs(b.at));
const threadLast   = id => { const m=threadMsgs(id); return m[m.length-1]||null; };
const threadUnread = id => threadMsgs(id).filter(m=>m.by!==me?.uid && tsMs(m.at)>(briefSeen[id]||0)).length;
function markThreadSeen(id){ briefSeen[id]=Date.now(); try{ localStorage.setItem("briefSeen",JSON.stringify(briefSeen)); }catch(e){} }
// proximity chip = the SOONEST of the AoR's briefed matters (multi-case aware)
const linkProx = l => { const bc=boardByCourt();
  const ks=linkMatters(l).map(m=>classify({courtNo:m.court,itemNo:m.item,listType:m.listType||""}, bc[m.court]));
  if(!ks.length) return {gap:null,short:"—"};
  return ks.slice().sort((a,b)=>((a.gap??999)-(b.gap??999)))[0]; };
const linkMattersLabel = l => linkMatters(l).map(m=>`Ct ${esc(m.court)} · item ${esc(m.item)}${m.title?` — ${esc(m.title)}`:''}`).join("<br>");
const proxBand = k => { if(!k||k.gap==null) return "far"; const g=k.gap; return g<=2?"red":g<=4?"amber":g<=7?"green":"far"; };
function updateBriefBadge(){
  const b=$("briefBadge"); if(!b) return; let cnt=0;
  if(canApproveBrief()) cnt = pendingBriefs().length + approvedBriefs().reduce((n,l)=>n+(threadUnread(l.id)>0?1:0),0);
  else cnt = myBriefLinks().reduce((n,l)=>n+(threadUnread(l.id)>0?1:0),0);
  if(cnt>0 && curTab!=="brief"){ b.textContent=cnt; b.classList.remove("hidden"); } else b.classList.add("hidden");
}
function briefStatusChip(s){
  const map={pending:["#8a6a12","#f6eccf","Awaiting approval"],approved:["#1e5d37","#dceee2","Approved · tracking"],
    declined:["#8a2a20","#f6dcd8","Declined"],revoked:["#555","#e7e9eb","Revoked"]};
  const [c,bg,t]=map[s]||map.pending; return `<span class="bchip" style="color:${c};background:${bg}">${t}</span>`;
}
function threadHtml(l){
  const msgs=threadMsgs(l.id);
  if(!msgs.length) return `<div class="bthread"><div class="bsub" style="text-align:center">No messages yet — start the conversation below.</div></div>`;
  return `<div class="bthread">`+msgs.map(m=>{ const mine=m.by===me?.uid;
    return `<div class="bbub ${mine?"me":"them"}">${mine?"":`<span class="bn">${esc(m.name||"")}</span>`}<span>${esc(m.text)}</span><span class="bt">${esc(clockIST(tsMs(m.at)))}</span></div>`;
  }).join("")+`</div>`;
}
function composeHtml(l, aorSide){
  const quick = aorSide ? [["reaching","Reaching"],["five","5 away"],["three","3 away"],["next","Next"]] : [];
  return `${quick.length?`<div class="bquick">`+quick.map(([k,lab])=>`<button data-bq="${esc(l.id)}|${k}">${lab}</button>`).join("")+`</div>`:''}
    <div class="bcompose">
      <textarea id="bc_${esc(l.id)}" rows="1" placeholder="Message ${aorSide?"the chamber":"the AoR"}…"></textarea>
      <button class="bsend" data-bsend="${esc(l.id)}"><i class="ti ti-send"></i></button>
    </div>`;
}
function wireBriefCommon(){
  document.querySelectorAll("[data-bsend]").forEach(b=>b.onclick=async()=>{ const id=b.dataset.bsend; const ta=$("bc_"+id); const v=ta?ta.value:""; if(ta) ta.value=""; await sendBriefMsg(id,v); });
  document.querySelectorAll("[data-bq]").forEach(b=>b.onclick=async()=>{ const [id,k]=b.dataset.bq.split("|"); await sendBriefMsg(id, QUICK[k]||k); });
  document.querySelectorAll(".bcompose textarea").forEach(ta=>{ ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); const id=ta.id.slice(3); const v=ta.value; ta.value=""; sendBriefMsg(id,v); } }; });
  document.querySelectorAll(".bthread").forEach(t=>{ t.scrollTop=t.scrollHeight; });
}
function renderBrief(){
  if(!BRIEFING){ $("main").innerHTML=""; return; }
  if(briefOpenThread) return renderBriefThread(briefOpenThread);
  updateBriefBadge();
  return canApproveBrief() ? renderBriefInbox() : renderBriefAoR();
}
function renderBriefAoR(){
  const mine=myBriefLinks(), srName=(CHAMBER.seniorName||"Senior").split(" ")[0];
  let h=`<div class="bwrap"><div class="bsec-h">People you're tracking</div>`;
  h+=`<button class="sh-btn navy" id="bNew"><i class="ti ti-plus"></i> Request to track someone</button>`;
  if(!mine.length) h+=`<div class="bempty">No requests yet — ask a senior's chamber for access to see his whole board while your matter reaches, and message his team.</div>`;
  else h+=mine.map(l=>{
    if(l.status==="approved"){ const st=linkState(l), d=linkSoonDate(l);
      const stChip = st==="active" ? briefStatusChip("approved")
        : st==="scheduled" ? `<span class="bchip" style="color:#8a6a12;background:#f6eccf">Opens ${esc(fmtDay(d))}</span>`
        : `<span class="bchip" style="color:#8a2a20;background:#f6dcd8">Expired</span>`;
      const ctl = st==="active"
        ? `<button class="sh-btn" style="margin-top:10px" data-viewboard="1"><i class="ti ti-layout-grid"></i> View ${esc(srName)}'s board</button>`
        : st==="scheduled"
          ? `<div class="brief-lapse">Approved for <b>${esc(fmtDay(d))}</b> — tracking opens that day.</div>`
          : `<div class="brief-lapse">This permission was for <b>${esc(fmtDay(d))}</b>. Tracking lasts one day only — <button class="blink-rereq" data-rereq="1">request again</button> for the next date.</div>`;
      return `<div class="bcard bhi">
        <div class="brow"><span class="bval">${esc(CHAMBER.seniorName)}</span>${stChip}</div>
        <div class="bsub">${linkMattersLabel(l)}</div>
        ${ctl}
        ${threadHtml(l)}${composeHtml(l,true)}</div>`;
    }
    return `<div class="bcard"><div class="brow"><span class="bval">${esc(CHAMBER.seniorName)}</span>${briefStatusChip(l.status)}</div>
      <div class="bsub">${linkMattersLabel(l)}</div>${l.status==="pending"?`<div class="bsub">Waiting for the chamber to approve.</div>`:''}</div>`;
  }).join("");
  h+=`</div>`; $("main").innerHTML=h;
  wireBriefCommon();
  const nb=$("bNew"); if(nb) nb.onclick=briefRequestForm;
  const vb=document.querySelector("[data-viewboard]"); if(vb) vb.onclick=()=>{ boardView="senior"; curTab="board";
    document.querySelectorAll("nav.botnav button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="board")); render(); };
  const rr=document.querySelector("[data-rereq]"); if(rr) rr.onclick=briefRequestForm;
  mine.forEach(l=>markThreadSeen(l.id)); updateBriefBadge();
}
function renderBriefInbox(){
  const pend=pendingBriefs(), appr=approvedBriefs();
  let h=`<div class="bwrap">`;
  if(pend.length){ h+=`<div class="bsec-h">Requests to approve</div>`;
    h+=pend.map(l=>`<div class="bcard">
      <div class="brow"><span class="bval">${esc(l.aorName)}</span>${briefStatusChip(l.status)}</div>
      <div class="bsub">wants to track the senior for:<br><b>${linkMattersLabel(l)}</b>${l.note?`<br>“${esc(l.note)}”`:''}</div>
      <div class="bsub" style="color:#8a6a12">Grants tracking for <b>${esc(linkDates(l).map(fmtDay).join(", ")||"today")}</b> only — one day.</div>
      <div class="bmsgs"><button class="bmsg ok" data-bdec="${esc(l.id)}|approved">Approve</button><button class="bmsg no" data-bdec="${esc(l.id)}|declined">Decline</button></div>
    </div>`).join(""); }
  h+=`<div class="bsec-h" style="margin-top:${pend.length?16:2}px">Collaboration inbox${appr.length?` · ${appr.length}`:''}</div>`;
  if(!appr.length) h+=`<div class="bempty">No active briefing conversations.</div>`;
  else{
    // Active (today's) briefings first, then scheduled, then expired — a briefing that
    // isn't today no longer shows a live proximity.
    const rank={active:0,scheduled:1,expired:2};
    const rows=appr.map(l=>({l,st:linkState(l),k:linkProx(l),unread:threadUnread(l.id),last:threadLast(l.id)}))
      .sort((a,b)=>(rank[a.st]-rank[b.st])||((a.k.gap??999)-(b.k.gap??999))||(b.unread-a.unread));
    h+=rows.map(({l,st,k,unread,last})=>{ const band=proxBand(k);
      const initials=(l.aorName||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
      const lastTxt=last?`${last.by===me?.uid?"You: ":""}${last.text}`:"No messages yet";
      const ms=linkMatters(l); const mlab=ms.length?`Ct ${esc(ms[0].court)} · item ${esc(ms[0].item)}${ms.length>1?` +${ms.length-1} more`:(ms[0].title?` — ${esc(ms[0].title)}`:'')}`:"—";
      const chip = st==="active" ? `<span class="bprox ${band}">${esc(k.short||"—")}</span>`
        : st==="scheduled" ? `<span class="bprox far">${esc(fmtDay(linkSoonDate(l)))}</span>`
        : `<span class="bprox far" style="opacity:.7">expired</span>`;
      return `<div class="bcard binbox${st!=="active"?" binbox-off":""}" data-open="${esc(l.id)}"><div class="binbox-row">
        <span class="bavatar">${esc(initials)}</span>
        <span class="bmeta"><span class="bnm">${esc(l.aorName)}</span><span class="bmatter">${mlab}</span><span class="blast">${esc(lastTxt)}</span></span>
        <span class="bright">${chip}${unread?`<span class="bunread">${unread}</span>`:''}</span>
      </div></div>`;
    }).join("");
  }
  h+=`</div>`; $("main").innerHTML=h;
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ briefOpenThread=b.dataset.open; renderBrief(); });
}
function renderBriefThread(id){
  const l=briefLinks.find(x=>x.id===id);
  if(!l){ briefOpenThread=null; return renderBrief(); }
  const k=linkProx(l), band=proxBand(k), ss=seniorState();
  const senTxt = ss.court ? (ss.mode==="confirmed"?`confirmed in Court ${esc(ss.court)}`:`likely in Court ${esc(ss.court)}`) : "location not set yet";
  $("main").innerHTML=`<div class="bwrap">
    <button class="bback" id="bBack"><i class="ti ti-chevron-left"></i> Collaboration inbox</button>
    <div class="bcard bhi">
      <div class="brow"><span class="bval">${esc(l.aorName)}</span><span class="bprox ${band}">${esc(k.short||"—")}</span></div>
      <div class="bsub">Their matter${linkMatters(l).length>1?"s":""}:<br><b>${linkMattersLabel(l)}</b></div>
      <div class="bsub">Senior: ${esc(CHAMBER.seniorName)} — ${senTxt}</div>
      ${threadHtml(l)}${composeHtml(l,false)}
      <button class="bmsg no small" style="margin-top:10px" data-bdec="${esc(l.id)}|revoked">Revoke access</button>
    </div></div>`;
  markThreadSeen(id); updateBriefBadge(); wireBriefCommon();
  const bk=$("bBack"); if(bk) bk.onclick=()=>{ briefOpenThread=null; renderBrief(); };
}
// Multi-case request: an AoR may be briefing the senior in several matters. Each case
// is entered by date + causelist type + court + item (decimals like 62.1, and 4-digit
// mentioning/pronouncement items) + party, then fetched for title / bench / AoR. The
// cases ride on the brieflink so they can be flagged on the senior's board.
function briefRequestForm(){
  const own=(myOwn||[]).slice();
  let cases=[], note="";
  const draw=()=>{
    $("modalRoot").innerHTML=`<div class="ovl" data-close><div class="sheet"><button class="sh-x" data-close>&times;</button>
      <div class="sheet-grab"></div>
      <h2>Request to track the senior</h2>
      <div class="sh-sub">Add the case(s) you're briefing ${esc(CHAMBER.seniorName)} in — we fetch the details, and your cases are flagged on his board. The chamber approves before anything is shared.</div>
      <div class="am-form">
        <label class="am-fld">Date<input type="date" id="bq_date" value="${todayISO()}"></label>
        <label class="am-fld">Causelist type<select id="bq_type">${CAUSELIST_TYPES.map(t=>`<option>${esc(t)}</option>`).join("")}</select></label>
        <div class="am-row">
          <label class="am-fld">Court<input id="bq_court" inputmode="numeric" autocomplete="off" placeholder="e.g. 6"></label>
          <label class="am-fld">Item<input id="bq_item" inputmode="decimal" autocomplete="off" placeholder="e.g. 4 or 62.1"></label>
        </div>
        <label class="am-fld">Appearing for<select id="bq_party"><option>Petitioner</option><option>Respondent</option></select></label>
        <button class="sh-btn" id="bq_add"><i class="ti ti-plus"></i> Fetch &amp; add case</button>
        <div class="am-err" id="bq_err"></div>
        ${cases.length?`<div class="sh-sec">Your cases (${cases.length})</div>`+cases.map((c,i)=>`<div class="bq-case">
          <div style="flex:1;min-width:0"><div class="bq-nm">${esc(c.title||("Ct "+c.court+" · item "+c.item))}</div>
            <div class="bq-de">Ct ${esc(c.court)} · item ${esc(c.item)} · ${esc(c.listType)} · for ${esc(c.party)}${c.bench?" · "+esc(c.bench):""}</div></div>
          <button class="bq-rm" data-rm="${i}">Remove</button></div>`).join(""):""}
        <label class="am-fld" style="margin-top:10px">Note to the chamber <span style="color:var(--mut);font-weight:400">(optional)</span><input id="bq_note" autocomplete="off" value="${esc(note)}" placeholder="e.g. briefing on the SLP tomorrow"></label>
        <button class="sh-btn navy" id="bq_save" style="margin-top:8px">${cases.length?`Send request with ${cases.length} case${cases.length>1?"s":""}`:"Send request"}</button>
      </div>
      ${own.length?`<div class="sh-sec">Your matters</div>${own.map(m=>`<div class="am-item" data-bqpick="${esc(m.court)}|${esc(m.item)}">
        <span class="am-ci">Ct ${esc(m.court)} · #${esc(m.item)}</span><span class="am-t">${esc(m.title||"")}</span></div>`).join("")}`:''}
    </div></div>`;
    $("modalRoot").querySelectorAll("[data-bqpick]").forEach(x=>x.onclick=()=>{ const [c,i]=x.dataset.bqpick.split("|"); $("bq_court").value=c; $("bq_item").value=i; });
    $("bq_add").onclick=async()=>{
      note=$("bq_note")?.value||note;
      const court=($("bq_court").value||"").trim(), item=($("bq_item").value||"").trim();
      $("bq_err").textContent="";
      if(!/^\d{1,2}$/.test(court)||+court<1||+court>17){ $("bq_err").textContent="Enter a court number (1–17)."; return; }
      if(!/^\d{1,4}(\.\d+)?$/.test(item)){ $("bq_err").textContent="Enter an item number (e.g. 4 or 62.1)."; return; }
      $("bq_add").innerHTML="Fetching…";
      const c=await fetchBriefCase({court,item,date:$("bq_date").value||todayISO(),type:$("bq_type").value,party:$("bq_party").value});
      cases.push(c); draw();
      if(!c.found) $("bq_err").textContent="Added — but not found in that list yet; details will fill later.";
    };
    $("modalRoot").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ note=$("bq_note")?.value||note; cases.splice(+b.dataset.rm,1); draw(); });
    $("bq_save").onclick=async()=>{
      note=$("bq_note")?.value||note;
      if(!cases.length){ $("bq_err").textContent="Add at least one case first."; return; }
      const first=cases[0];
      try{ await db.add("brieflinks",{aorUid:me.uid, aorName:me.name||"Advocate", aorDesig:me.designation||"Advocate",
          matters:cases, court:first.court, item:first.item, title:first.title||"", listType:first.listType||"",
          date:first.date||todayISO(), note:note.trim(), status:"pending", at:db.now(), ...linkWindow(cases.map(c=>c.date))});
        closeModal(); curTab="brief";
        document.querySelectorAll("nav.botnav button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="brief")); render(); }
      catch(e){ $("bq_err").textContent="Could not send — "+(e.message||e); }
    };
  };
  draw();
}
async function decideBrief(id,status){
  const l=briefLinks.find(x=>x.id===id);
  try{ await db.update("brieflinks/"+id,{status,decidedBy:me.uid,decidedAt:db.now()});
    if(status!=="approved" && briefOpenThread===id) briefOpenThread=null;
    if(l&&l.aorUid) await syncBriefAccess(l.aorUid, {id, status}); }catch(e){}
}
// Mirror the AoR's live board-tracking window to briefaccess/{aorUid} (union of their
// approved brieflinks' windows). The rules gate the day-sheet read on this, so an
// approval only opens the board for the day(s) it was for. Written by the chamber team
// on approve/revoke; natural expiry needs no write (rules compare request.time).
async function syncBriefAccess(aorUid, override){
  const rows=briefLinks.filter(l=>l.aorUid===aorUid)
    .map(l=> (override&&l.id===override.id)?{...l,status:override.status}:l)
    .filter(l=>l.status==="approved" && l.expiresAt);
  const starts=rows.map(l=>l.startsAt).filter(v=>typeof v==="number"), exps=rows.map(l=>l.expiresAt).filter(v=>typeof v==="number");
  try{ if(exps.length) await db.set("briefaccess/"+aorUid,{startsAt:starts.length?Math.min(...starts):0, expiresAt:Math.max(...exps), by:me.uid, at:db.now()},true);
    else await db.remove("briefaccess/"+aorUid); }catch(e){}
}
// Messages live in a PER-LINK thread (not the general chamber chat), so eight AoRs
// stay eight separate conversations. Name only, never designation.
async function sendBriefMsg(id,text){
  text=(text||"").trim(); if(!text) return;
  const l=briefLinks.find(x=>x.id===id); if(!l) return;
  try{ const mid=await db.add("briefmsgs",{linkId:id, by:me.uid, name:me.name||"Advocate", text, at:db.now()});
    relayPush({kind:"chat", id:String(mid||Date.now()), fromUid:me.uid, title:"Briefing — "+(me.name||""), body:text, tag:"brief-"+id});
    markThreadSeen(id); }catch(e){}
}
if(BRIEFING) document.addEventListener("click",ev=>{
  const dec=ev.target.closest("[data-bdec]"); if(dec){ const [id,st]=dec.dataset.bdec.split("|"); decideBrief(id,st); return; }
});

async function setSeniorCourt(court){
  if(!court) return;
  await db.set("config/live",{ court:{court:String(court),at:db.now(),by:me.uid} }, true);
}
function boot(user){
  unsub.forEach(u=>u&&u()); unsub=[]; if(userDocUnsub){userDocUnsub();userDocUnsub=null;}
  bootStarted=false;   // a new session (user switch / re-login) must re-establish the live-data watchers
  briefOpenThread=null; boardView="mine";   // reset briefing view state for the new user
  if(!user){ me=null; $("app").classList.add("hidden"); $("login").classList.remove("hidden"); stopPolling(); return; }
  const uid=user.uid;
  userDocUnsub=db.watchDoc("users/"+uid, u=>{
    me = u ? {uid,...u} : {uid,role:"pending",name:user.email};
    if(emailKey(me.email||user.email)===emailKey(CHAMBER.adminEmail)) me.role="admin";
    if(!bootStarted){ bootStarted=true; startWatchers(); }
    gateUI();
  });
}
let bootStarted=false;
function startWatchers(){
  unsub.push(db.watchCollection("users",rows=>{ users={}; rows.forEach(u=>users[u.id]=u); scheduleRender(); }));
  unsub.push(db.watchDoc("config/live", d=>{ live=d||{}; delete live.id; scheduleRender(); }));
  unsub.push(db.watchCollection("messages",rows=>{ messages={}; rows.forEach(m=>messages[m.id]=m); updateChatBadge(); if(curTab==="chat") paintChatList(); purgeOldChat(); }));
  unsub.push(db.watchDoc("daysheets/"+todayISO(), d=>{ daysheet=d||{entries:[]}; scheduleRender(); }));
  if(me?.uid) unsub.push(db.watchDoc("usermatters/"+me.uid, d=>{ myOwn=(d&&d.matters)||[]; scheduleRender(); }));
  if(BRIEFING){
    unsub.push(db.watchCollection("brieflinks",rows=>{ briefLinks=rows||[]; updateBriefBadge(); scheduleRender(); }));
    unsub.push(db.watchCollection("briefmsgs",rows=>{ briefMsgs=rows||[]; updateBriefBadge(); if(curTab==="brief") renderBrief(); }));
  }
  loadCourtUpdates();
  startPolling();
}
const isStandalone = () => me && me.role==="user";   // a self-registrant with their own office
function gateUI(){
  const approved = me && ["admin","senior","clerk","pa","junior","user"].includes(me.role);
  $("login").classList.toggle("hidden", !!approved);
  $("app").classList.toggle("hidden", !approved);
  if(approved){
    if(BRIEFING) $("tabBrief").classList.remove("hidden");
    // a standalone individual has no chamber-internal chat — hide that tab for them
    const chatBtn=document.querySelector('nav.botnav button[data-tab="chat"]'); if(chatBtn) chatBtn.classList.toggle("hidden", isStandalone());
    if(isStandalone() && curTab==="chat") curTab="board";
    paintMasthead(); render(); initNotify();
  }
  else if(me){ $("lgErr").textContent = me.role==="pending" ? "Your account isn't approved yet." : ""; }
}
// Header shows the OFFICE of whoever is logged in: the chamber for chamber members,
// the person's own name + designation for a self-registrant.
function initials(s){ return (s||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function paintMasthead(){
  const seal=document.querySelector(".top .seal"), main=document.querySelector(".top .ttl-main"), sub=$("hdrSub");
  if(!seal||!main||!sub) return;
  if(isStandalone()){
    seal.textContent=initials(me.name); main.textContent=me.name||"My office";
    sub.textContent=(me.designation? me.designation+" · " : "")+CHAMBER.court;
  } else {
    seal.textContent="SD"; main.textContent="Chamber Display Board";
    sub.textContent=CHAMBER.seniorName ? CHAMBER.seniorName+" · "+CHAMBER.court : CHAMBER.court;
  }
}

  if(c) openCourtModal(c.dataset.court);
});
$("routeRail").addEventListener("click",ev=>{ const c=ev.target.closest("[data-court]"); if(c) openCourtModal(c.dataset.court); });
$("modalRoot").addEventListener("click",async ev=>{
  const t=ev.target;
  if(t.classList.contains("ovl") || t.closest("button[data-close]")){ closeModal(); return; }
  const m=t.closest("[data-matter]");
  if(m){ const [ct,it]=m.dataset.matter.split("|"); openMatterModal(ct,it); return; }
  const sh=t.closest("[data-senhere]");
  if(sh){ await setSeniorCourt(sh.dataset.senhere); openCourtModal(sh.dataset.senhere); return; }
  const ps=t.closest("[data-poset]");
  if(ps){ const [ct,it]=ps.dataset.poset.split("|");
    const mode=$("poMode").value==="after"?"after":"slot";
    const after=mode==="after"?($("poAfter").value||"").trim():null;
    await setPO(ct,it,mode,after); openMatterModal(ct,it); return; }
  const pc=t.closest("[data-poclear]");
  if(pc){ const [ct,it]=pc.dataset.poclear.split("|"); await clearPO(ct,it); openMatterModal(ct,it); return; }
});
$("btnAdd").onclick=addMatterForm;
$("btnRefresh").onclick=hardRefresh;
$("btnNotify").onclick=toggleNotify;
$("btnOut").onclick=()=>auth.signOut();

/* login form */
$("lgGo").onclick=async()=>{
  $("lgErr").textContent="";
  try{ await auth.signIn($("lgEmail").value.trim(), $("lgPass").value); }
  catch(e){ $("lgErr").textContent = (e.code||"").includes("password")||(e.code||"").includes("credential")
    ? "Wrong email or password." : (e.message||"Sign-in failed."); }
};
$("lgPass").addEventListener("keydown",e=>{ if(e.key==="Enter") $("lgGo").click(); });
$("lgReset").onclick=async()=>{
  const em=$("lgEmail").value.trim(); if(!em){ $("lgErr").textContent="Enter your email first."; return; }
  try{ await auth.resetPassword(em); $("lgErr").textContent="Reset link sent to "+em; }
  catch(e){ $("lgErr").textContent=e.message||"Could not send reset."; }
};
// Create-account (self-registration) — makes a standalone user with their own office.
$("lgToReg").onclick=()=>{ $("signinForm").classList.add("hidden"); $("regForm").classList.remove("hidden"); $("lgSub").textContent="Create your account"; };
$("lgToSignin").onclick=()=>{ $("regForm").classList.add("hidden"); $("signinForm").classList.remove("hidden"); $("lgSub").textContent="Live Supreme Court board"; };
$("rgGo").onclick=async()=>{
  $("rgErr").textContent="";
  const name=$("rgName").value.trim(), phone=$("rgPhone").value.replace(/\D/g,""), email=$("rgEmail").value.trim(),
        designation=$("rgDesig").value, pass=$("rgPass").value;
  if(name.length<2){ $("rgErr").textContent="Enter your full name."; return; }
  if(phone.length<10){ $("rgErr").textContent="Enter a valid mobile number."; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $("rgErr").textContent="Enter a valid email."; return; }
  if(pass.length<6){ $("rgErr").textContent="Password must be at least 6 characters."; return; }
  $("rgGo").disabled=true; $("rgErr").textContent="Creating your account…";
  try{ await auth.signUp(email, pass, {name, phone, designation}); }
  catch(e){ $("rgGo").disabled=false;
    $("rgErr").textContent = (e.code||"").includes("email-already-in-use") ? "That email already has an account — sign in instead."
      : (e.code||"").includes("weak-password") ? "Choose a stronger password." : (e.message||"Could not create account."); }
};
function initNotify(){
  try{ notifyOn = localStorage.getItem("boardNotify")==="1" && ("Notification" in window) && Notification.permission==="granted"; }catch(e){ notifyOn=false; }
  updateNotifyBtn(); if(notifyOn){ acquireWake(); syncPushSub(); }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && me && !DEMO) fetchBoard(); if(!document.hidden && notifyOn){ acquireWake(); syncPushSub(); } });
